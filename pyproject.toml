[project]
name = "harbor"
version = "0.1.0"
description = "A Docker Compose runtime for self-hosted applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.13.4",
    "cryptography>=48.0.0",
    "filelock>=3.29.4",
    "tabulate>=0.10.0",
    "requests>=2.32.0",
]

[project.urls]
Repository = "https://git.zyx.pw/P2Project/harbor"

[project.scripts]
harbor = "harbor.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.21",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a real docker daemon (deselected by default)",
]
addopts = "-m 'not docker'"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
