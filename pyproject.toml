[project]
name = "kelso"
version = "0.1.0"
description = "A Docker Compose runtime for self-hosted applications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.13.4",
    "cryptography>=48.0.0",
    "filelock>=3.29.4",
    "tabulate>=0.10.0",
    "requests>=2.32.0",
    "tomlkit>=0.13.0",
    "psutil>=6.0",
    # kelsod's. The CLI never imports them -- see kelso/daemon/__init__.py --
    # but kelsod is how kelso is normally run, so they are not optional.
    "fastapi>=0.121.0",
    "schedule>=1.2",
    "uvicorn>=0.34.0",
]

[project.urls]
Repository = "https://github.com/nepthar/kelso"

[project.scripts]
kelso = "kelso.cli.main:main"
kelsod = "kelso.daemon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kelso"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.21",
    "vulture>=2.16",
    # httpx2 backs starlette's TestClient.
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a real docker daemon (deselected by default)",
]
addopts = "-m 'not docker'"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
