# Fixture happ: web + lan routes declared inline under the run unit.

[app]
version      = "0.1.0"
display_name = "Routes Demo"
subdomain    = "photos"

[config]
subdomain = { default = "photos" }

[run.main]
image = "alpine:latest"
cmd   = ["/bin/sh", "-c", "sleep infinity"]

# The reserved name "main" -> photos.<domain>; "api" -> api-photos.<domain>;
# "admin" is lan-only (host port published, no reverse-proxy route).
[run.main.routes]
main  = { port = "8080", publish = "web" }
api   = { port = "8081", publish = "web" }
admin = { port = "8082", publish = "lan" }
