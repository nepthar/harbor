# Fixture happ: interesting routes for the operator to assign to providers.

[app]
version      = "0.1.0"
display_name = "Routes Demo"
subdomain    = "photos"

[config]
subdomain = { default = "photos" }

[run.main]
image = "alpine:latest"
cmd   = ["/bin/sh", "-c", "sleep infinity"]

# The reserved name "main" -> photos.<domain>; "api" -> api-photos.<domain>;
# "admin" is not public (host port only until the operator assigns a provider).
[run.main.routes]
main  = { port = "8080", public = true }
api   = { port = "8081", public = true }
admin = { port = "8082" }
