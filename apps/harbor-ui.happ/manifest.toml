[app]
version      = "0.5.0"
display_name = "Harbor UI"
description  = "Web interface for harbor, over the harbord admin socket"
subdomain    = "harbor"

[config]
# Development escape hatch. Docker Desktop's bind mounts cannot carry a unix
# socket, so on macOS the socket is visible in the container and unusable --
# point this at `harbord --port N --host 0.0.0.0` instead. Empty means use the
# socket, which is what a Linux host should do.
api_address = { default = "", desc = "host:port of harbord, instead of the admin socket" }

[volumes]
ui   = { kind = "app", src = "ui", desc = "The application"}
venv = { kind = "temp", desc = "virtual env, dependencies, etc." }
conn = { kind = "host", desc = "The $harbor/var/conn directory holding admin.sock" }

[run.main]
image   = "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
cmd     = ["/app/start.sh"]
volumes = { ui = "/app", venv = "/venv", conn = "/harbor/conn" }
routes  = { main = { port = "8080" } }

[run.main.env]
HARBOR_SOCKET            = "/harbor/conn/admin.sock"
HARBOR_API               = "${api_address}"
PORT                     = "8080"
PYTHONUNBUFFERED         = "1"
UV_PROJECT_ENVIRONMENT   = "/venv"
UV_NO_MANAGED_PYTHON     = "1"

[commands.test]
cmd = ["/bin/sh", "-c", "echo 'Hello, world!'"]
desc = "Test running a command"